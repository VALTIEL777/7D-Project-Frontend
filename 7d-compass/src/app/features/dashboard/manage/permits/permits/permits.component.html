<app-dashboard-layout>
  <app-card-with-button title="Permits Management" [showEyeButton]="false">
    <!-- Indicador de carga -->
    <div *ngIf="isLoading" class="loading-container" style="text-align: center; padding: 20px;">
      <mat-spinner diameter="40" style="margin: 0 auto;"></mat-spinner>
      <p style="margin-top: 10px; color: #666;">Cargando permisos...</p>
    </div>

    <!-- Tabla de datos -->
    <app-data-table
      *ngIf="!isLoading"
      [title]="'Permits Management'"
      [data]="filteredPermitData"
      [columns]="columns"
      [pageSizeOptions]="[5, 10, 20]"
      [hasFiles]="hasPermitFiles"
      [showUploadButton]="true"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (uploadPdf)="onUploadPdf($event)"
      (deleteFile)="onDeletePermitFile($event)">
    </app-data-table>
  </app-card-with-button>
</app-dashboard-layout>
