<app-dashboard-layout>
  <app-card-with-button title="Supervisor Management" [showEyeButton]="false">
    <app-data-table
      [title]="'Supervisor Management'"
      [data]="filteredSupervisorData"
      [columns]="columns"
      [pageSizeOptions]="[15, 20, 25]"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)">
    </app-data-table>
  </app-card-with-button>
</app-dashboard-layout>
