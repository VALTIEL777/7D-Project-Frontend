<app-dashboard-layout>
  
      <div *ngIf="isLoading" style="display:flex; justify-content:center; align-items:center; height:300px;">
    <mat-spinner diameter="60"></mat-spinner>
  </div>

  <!-- 🔥 El contenido solo se muestra cuando termina la carga -->
  <div *ngIf="!isLoading" style="display: flex; flex-direction: column; gap: 1rem;">
        

      <app-card-with-button title="Crew Payment" [showEyeButton]="false">
        <app-data-table
        [title]="'Team'"
        [data]="ticketData"
        [columns]="ticketColumns"
        (edit)="onEditTicket($event)"
        (delete)="onDeleteTicket($event)">
        </app-data-table>

         <div class="total-row" style="text-align: right; margin-top: 1rem; padding-right: 1rem;">
    <strong>Total general:</strong> ${{ totalGeneral }}
  </div>
      </app-card-with-button>
      
      
        <app-card-with-button title="Revenues" [showEyeButton]="false">
        <app-data-table
        [title]="'Team'"
        [data]="invoiceData"
        [columns]="invoiceColumns"
        (edit)="onEditInvoice($event)"
        (delete)="onDeleteTicket($event)">
        </app-data-table>
      </app-card-with-button>

      </div>

      
</app-dashboard-layout>
