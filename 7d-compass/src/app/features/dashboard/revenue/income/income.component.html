<app-dashboard-layout>

        <!-- Invoice Excel Processing Stepper -->
        <app-invoice-stepper-card
          title="Invoice Excel Processing"
          [data]="stepperData"
          (stepCompleted)="onStepCompleted($event)"
          (processCompleted)="onProcessCompleted($event)">
        </app-invoice-stepper-card>

        <app-card-with-button title="Revenues" [showEyeButton]="false">
        <app-data-table
        [title]="'Team'"
        [data]="filteredInvoiceData"
        [columns]="invoiceColumns">
        </app-data-table>
      </app-card-with-button>

</app-dashboard-layout>
