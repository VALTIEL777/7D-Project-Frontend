<app-dashboard-layout>
  <div class="fines-penalties-container">
    <app-card-with-button title="Fines & Penalties" [showEyeButton]="false">
      <div class="table-container">
        <table mat-table [dataSource]="filteredFinesData" class="mat-elevation-z1">
          <!-- Location Column -->
          <ng-container matColumnDef="location">
            <th mat-header-cell *matHeaderCellDef>Location</th>
            <td mat-cell *matCellDef="let fine">{{ fine.location }}</td>
          </ng-container>

          <!-- Ticket Column -->
          <ng-container matColumnDef="ticket">
            <th mat-header-cell *matHeaderCellDef>Ticket</th>
            <td mat-cell *matCellDef="let fine">{{ fine.ticket }}</td>
          </ng-container>

          <!-- Fine Column -->
          <ng-container matColumnDef="fine">
            <th mat-header-cell *matHeaderCellDef>Fine</th>
            <td mat-cell *matCellDef="let fine">{{ fine.fine }}</td>
          </ng-container>

          <!-- Amount Column -->
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let fine">${{ fine.amount }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let fine">
              <span [class]="'status-' + fine.status.toLowerCase()">{{ fine.status }}</span>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let fine">{{ fine.description }}</td>
          </ng-container>

          <!-- Evidence Column -->
          <ng-container matColumnDef="evidence">
            <th mat-header-cell *matHeaderCellDef>Evidence</th>
            <td mat-cell *matCellDef="let fine; let i = index">
              <div class="evidence-actions">
                <button mat-icon-button (click)="triggerFileUpload(i)" class="upload-btn">
                  <mat-icon>upload</mat-icon>
                </button>
                <input
                  type="file"
                  [id]="'fileInput-' + i"
                  style="display: none;"
                  (change)="onFileSelected($event, fine)"
                  accept="image/*,.pdf,.doc,.docx">

                <button
                  mat-icon-button
                  (click)="downloadEvidence(fine)"
                  [disabled]="!fine.evidence"
                  class="download-btn">
                  <mat-icon>download</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['location', 'ticket', 'fine', 'amount', 'status', 'description', 'evidence']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['location', 'ticket', 'fine', 'amount', 'status', 'description', 'evidence'];"></tr>
        </table>
      </div>
    </app-card-with-button>
  </div>
</app-dashboard-layout>
