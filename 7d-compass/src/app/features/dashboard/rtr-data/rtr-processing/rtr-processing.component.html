<app-dashboard-layout>
  <!-- Test Button -->
  <div style="margin-bottom: 20px; text-align: center;">
    <button
      mat-raised-button
      color="accent"
      (click)="runExcelDatabaseTest()"
      style="margin: 10px;">
      <mat-icon>science</mat-icon>
      Test Excel/DB Selection
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="showApiStructure()"
      style="margin: 10px;">
      <mat-icon>code</mat-icon>
      Show API Structure
    </button>
  </div>

  <!-- CONTENEDOR GENERAL -->
  <div class="dashboard-wrapper">
    <!-- GRID PRINCIPAL -->
    <div class="dashboard-grid">
      <!-- Stepper Card -->
      <app-stepper-card
        title="RTR Processing Workflow"
        [data]="stepperData"
        (stepCompleted)="onStepCompleted($event)"
        (processCompleted)="onProcessCompleted($event)"
        class="stepper-card-full-width">
      </app-stepper-card>

      <!-- Subida de nuevo RTR -->
      <app-card-with-button title="Received RTR History" [showEyeButton]="true" class="spaced-card">
        <div class="history-scrollable-content">
          <div *ngIf="isLoadingRTRs" class="loading-state">
            <mat-spinner diameter="20"></mat-spinner>
            <span>Loading RTR files...</span>
          </div>
          <div *ngIf="!isLoadingRTRs && receivedRTRs.length === 0" class="empty-state">
            <mat-icon>folder_open</mat-icon>
            <span>No RTR files found</span>
          </div>
          <div *ngFor="let rtr of receivedRTRs" class="history-item">
            <div class="history-content">
              <div class="history-info">
                <h4 class="history-title">{{ rtr.name }}</h4>
                <p class="history-date">{{ formatDate(rtr.lastModified) }}</p>
              </div>
              <button mat-raised-button (click)="downloadRTR(rtr)">
                <mat-icon>file_download</mat-icon> Download
              </button>
            </div>
            <hr class="custom-divider" />
          </div>
        </div>
      </app-card-with-button>

      <!-- Descargar RTR -->
      <app-card-with-button title="7D-RTR" [showEyeButton]="true" class="spaced-card">
        <div class="history-scrollable-content">
          <div *ngIf="isLoadingRTRs" class="loading-state">
            <mat-spinner diameter="20"></mat-spinner>
            <span>Loading RTR files...</span>
          </div>
          <div *ngIf="!isLoadingRTRs && sentRTRs.length === 0" class="empty-state">
            <mat-icon>folder_open</mat-icon>
            <span>No RTR files found</span>
          </div>
          <div *ngFor="let rtr of sentRTRs" class="history-item">
            <div class="history-content">
              <div class="history-info">
                <h4 class="history-title">{{ rtr.name }}</h4>
                <p class="history-date">{{ formatDate(rtr.lastModified) }}</p>
              </div>
              <button mat-raised-button (click)="downloadRTR(rtr)">
                <mat-icon>file_download</mat-icon> Download
              </button>
            </div>
            <hr class="custom-divider" />
          </div>
        </div>
      </app-card-with-button>



    </div>
    <!-- cierre de .dashboard-grid -->
  </div>
  <!-- cierre de .dashboard-wrapper -->
</app-dashboard-layout>
