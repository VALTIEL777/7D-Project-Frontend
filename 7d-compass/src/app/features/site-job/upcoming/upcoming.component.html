<app-sitejob-sidenavbar [teamLeader]="teamLeader" [teamMembers]="teamMembers">
  <app-sitejob-layout></app-sitejob-layout>

  <div class="content-wrapper">
    <h2 class="section-title">Remaining Locations</h2>

    <!-- 🔍 Campo de búsqueda -->
    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;">
      <mat-label>Search location	</mat-label>
        <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="filterText" placeholder="Search by address or job type	">
    </mat-form-field>

    <!-- 📍 Lista filtrada -->
    <div *ngFor="let location of filteredLocations" class="location-card">
      <p class="address"><strong>{{ location.address }}</strong></p>

      <h3 class="sub-title">General Info</h3>
      <ul class="info-list">
        <li *ngIf="location.job"><strong>Job:</strong> {{ location.job }}</li>
        <li *ngIf="location.width && location.length"><strong>Size:</strong> {{ location.width }} x {{ location.length }} ft</li>
        <li *ngIf="location.surface"><strong>Surface:</strong> {{ location.surface }} m²</li>
            <li><strong>Crew type:</strong> {{crewType}} </li>

      </ul>

      <button mat-button color="primary" (click)="goToCurrent(location)">Select</button>

      <hr class="divider" />
    </div>
  </div>
</app-sitejob-sidenavbar>
