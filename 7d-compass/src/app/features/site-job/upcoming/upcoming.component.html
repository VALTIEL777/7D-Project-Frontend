<app-sitejob-sidenavbar [teamLeader]="teamLeader" [teamMembers]="teamMembers">
  
  <div class="map-container">
  <div *ngIf="staticMapUrl" class="static-map">
    <img
      [src]="staticMapUrl"
      alt="Route Map"
      [width]="staticMapWidth"
      [height]="staticMapHeight"
      class="map-image"
    />

    <div *ngIf="showNoRoutesOverlay" class="no-routes-overlay">
      <div class="no-routes-message">
        <mat-icon>route</mat-icon>
        <h3>No Active Routes</h3>
        <p>Routes will appear here once they are generated</p>
      </div>
    </div>
  </div>
</div>


  <!-- 🔄 Spinner de carga -->
  <div *ngIf="isLoading" class="loader-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <!-- ✅ Contenido visible solo cuando no hay carga -->
  <div *ngIf="!isLoading" class="content-wrapper">
    <h2 class="section-title">Remaining Locations</h2>

    <!-- 🔍 Campo de búsqueda -->
    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;">
      <mat-label>Search location</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="filterText" placeholder="Search by address or job type">
    </mat-form-field>

    <!-- ❌ Mostrar mensaje si no hay resultados -->
    <div *ngIf="filteredLocations.length === 0" class="no-locations">
      <p class="no-locations-text">
        <mat-icon color="warn">info</mat-icon>
        There is no route assigned yet.
      </p>
    </div>

    <!-- 📍 Lista filtrada -->
    <div *ngFor="let location of filteredLocations" class="location-card">
      <div class="address-container">
        <p class="address"><strong>{{ location.address }}</strong></p>
        <button mat-raised-button class="custom-select-button" (click)="goToCurrent(location)">
          <mat-icon class="icon">place</mat-icon>Go to location
        </button>
      </div>
      <hr class="divider" />
    </div>
  </div>

  <app-sitejob-tabs></app-sitejob-tabs>
</app-sitejob-sidenavbar>
