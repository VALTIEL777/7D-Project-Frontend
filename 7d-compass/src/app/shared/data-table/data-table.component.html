<div class="table-container">

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
    <ng-container *ngFor="let column of columns" [matColumnDef]="column.name">
      <th mat-header-cell *matHeaderCellDef>
        <ng-container *ngIf="!column.isActionColumn; else noSort">
          <span mat-sort-header>{{ column.header }}</span>
        </ng-container>
        <ng-template #noSort>
          {{ column.header }}
        </ng-template>
      </th>
      <td
        mat-cell
        *matCellDef="let element"
        [class.actions-cell]="column.isActionColumn"
      >
        <ng-container *ngIf="!column.isActionColumn; else actions">
          <span *ngIf="!column.isHtml && !column.isCustomTemplate">
            {{ column.cell(element) }}
          </span>
          <span *ngIf="column.isHtml" [innerHTML]="column.cell(element)"></span>
          <ng-container *ngIf="column.isCustomTemplate">
            <ng-container [ngSwitch]="column.name">
              <!-- Custom template for comment7d dropdown -->
              <ng-container *ngSwitchCase="'comment7d'">
                <div class="comment-dropdown-container">
                  <!-- Show as text if not editing or if comment is not a predefined option -->
                  <div *ngIf="!element.commentEditing && !isPredefinedComment(element.comment7d)" class="comment-display">
                    <span class="comment-text">{{ element.comment7d || 'N/A' }}</span>
                    <button
                      mat-icon-button
                      class="edit-comment-btn"
                      matTooltip="Edit comment"
                      (click)="startCommentEdit(element)">
                      <mat-icon>edit</mat-icon>
                    </button>
                  </div>

                  <!-- Show dropdown for editing or if comment is a predefined option -->
                  <div *ngIf="element.commentEditing || isPredefinedComment(element.comment7d)" class="comment-edit">
                    <mat-form-field appearance="outline" class="comment-dropdown">
                      <mat-select
                        [value]="element.comment7d || ''"
                        (selectionChange)="onCommentChange($event, element)"
                        placeholder="Select status">
                        <mat-option value="TK - LAYOUT">TK - LAYOUT</mat-option>
                        <mat-option value="TK - ON HOLD OFF">TK - ON HOLD OFF</mat-option>
                        <mat-option value="TK - CANCELLED">TK - CANCELLED</mat-option>
                        <mat-option value="TK - ON PROGRESS">TK - ON PROGRESS</mat-option>
                        <mat-option value="TK - COMPLETED">TK - COMPLETED</mat-option>
                        <mat-option value="NEEDS PERMISION EXTENDED">NEEDS PERMISION EXTENDED</mat-option>
                        <mat-option value="ON HOLD OFF">ON HOLD OFF</mat-option>
                        <mat-option value="ON PROGRESS">ON PROGRESS</mat-option>
                        <mat-option value="ON SCHEDULE">ON SCHEDULE</mat-option>
                        <mat-option value="DIGGER APPLAY">DIGGER APPLAY</mat-option>
                        <mat-option value="HMA- ON PROGRESS">HMA- ON PROGRESS</mat-option>
                      </mat-select>
                    </mat-form-field>
                    <button
                      mat-icon-button
                      class="save-comment-btn"
                      matTooltip="Save changes"
                      (click)="saveComment(element)"
                      [disabled]="!element.commentChanged">
                      <mat-icon>save</mat-icon>
                    </button>
                    <button
                      *ngIf="element.commentEditing"
                      mat-icon-button
                      class="cancel-comment-btn"
                      matTooltip="Cancel edit"
                      (click)="cancelCommentEdit(element)">
                      <mat-icon>close</mat-icon>
                    </button>
                  </div>
                </div>
              </ng-container>
              <!-- Default case for other custom templates -->
              <ng-container *ngSwitchDefault>
                {{ column.cell(element) }}
              </ng-container>
            </ng-container>
          </ng-container>
        </ng-container>
        <ng-template #actions>
          <div class="actions-container">
            <button
              *ngIf="showEditButton"
              mat-icon-button
              class="edit-button"
              matTooltip="Edit"
              (click)="edit.emit(element)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              *ngIf="showDeleteButton"
              mat-icon-button
              class="delete-button"
              matTooltip="Delete"
              (click)="$event.stopPropagation(); delete.emit(element)"
            >
              <mat-icon>delete</mat-icon>
            </button>

             <button
      *ngIf="showViewButton && column.name === 'show' && shouldShowViewButton(element)"
  mat-icon-button
  [color]="getViewButtonColor(element)"
  class="show-button"
  [matTooltip]="getViewButtonTooltip(element)"
  (click)="view.emit(element)">
    <mat-icon>visibility</mat-icon>
    </button>
             <button
      *ngIf="column.name === 'actions' && showUploadButton && !hasFiles(element)"
  mat-icon-button
  class="upload-button"
  matTooltip="Upload PDF"
  (click)="uploadPdf.emit(element)">
    <mat-icon>upload_file</mat-icon>
    </button>
             <button
      *ngIf="column.name === 'actions' && hasFiles(element)"
  mat-icon-button
  class="delete-file-button"
  matTooltip="Delete PDF"
  (click)="deleteFile.emit(element)">
    <mat-icon>delete_forever</mat-icon>
    </button>
          </div>
        </ng-template>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
</div>
