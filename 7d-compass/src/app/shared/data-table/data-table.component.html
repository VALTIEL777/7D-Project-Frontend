<div class="table-container">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
    <ng-container *ngFor="let column of columns" [matColumnDef]="column.name">
      <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
      <td
        mat-cell
        *matCellDef="let element"
        [class.actions-cell]="column.isActionColumn"
      >
        <ng-container *ngIf="!column.isActionColumn; else actions">
 <span *ngIf="!column.isHtml">
    {{ column.cell(element) }}
  </span>
  <span *ngIf="column.isHtml" [innerHTML]="column.cell(element)"></span>        </ng-container>
        <ng-template #actions>
          <div class="actions-container">
            <button
              mat-icon-button
              class="edit-button"
              matTooltip="Edit"
              (click)="edit.emit(element)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              class="delete-button"
              matTooltip="Delete"
              (click)="$event.stopPropagation(); delete.emit(element)"
            >
              <mat-icon>delete</mat-icon>
            </button>

             <button
      *ngIf="column.name === 'show'"
  mat-icon-button
  class="show-button"
  matTooltip="Show Route">
    <mat-icon>visibility</mat-icon>
    </button>
             <button
      *ngIf="column.name === 'actions' && !hasFiles(element)"
  mat-icon-button
  class="upload-button"
  matTooltip="Upload PDF"
  (click)="uploadPdf.emit(element)">
    <mat-icon>upload_file</mat-icon>
    </button>
             <button
      *ngIf="column.name === 'actions' && hasFiles(element)"
  mat-icon-button
  class="delete-file-button"
  matTooltip="Delete PDF"
  (click)="deleteFile.emit(element)">
    <mat-icon>delete_forever</mat-icon>
    </button>
          </div>
        </ng-template>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
</div>
