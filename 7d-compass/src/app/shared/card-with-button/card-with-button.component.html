<div class="analytics-card">


  <div class="card-content">
    <h2 class="card-title" [class.with-fab]="showEyeButton || showEditButton">
      {{ title }}
    </h2>

    <div
      class="card-label"
      *ngIf="showLabel"
      [ngClass]="{ positive: isPositive, negative: !isPositive }"
    >
      {{ percentage }}%
      <span>{{ isPositive ? "Increase" : "Decrease" }}</span>
    </div>

    <p class="card-description" *ngIf="description?.trim()">
      {{ description }}
    </p>
    <ng-content></ng-content>
  </div>
</div>
